name: Publish package

on:
    release:
        types: created
jobs:
    Publish:
        runs-on: ubuntu-latest

        permissions:
            contents: write
            id-token: write

        steps:
            - name: Setup Action
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "latest"
                  registry-url: https://registry.npmjs.org/

            - name: Setup PNPM
              uses: pnpm/action-setup@v6

            - name: Install dependencies
              run: pnpm install --no-frozen-lockfile

            - name: Test
              run: node --run test

            - name: Build
              run: node --run build

            - name: Stage packages
              run: |
                  for dir in packages/*/; do
                    if [ -f "$dir/package.json" ]; then
                      cat .npmignore .gitignore | grep -vxE '/?out/?' > "$dir/.npmignore"
                      pnpm --filter "./$dir" stage publish --no-git-checks || true
                    fi
                  done
